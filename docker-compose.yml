version: "3.9"

services:
  api_postgre:
    image: docker_identityapp:latest
    container_name: api_postgre
    ports:
      - "8080:8080"
    environment:
      SQL_CONNECTION: "Host=postgre_db;Port=5432;Database=mydb;Username=myuser;Password=mypassword"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "rmuser"
      RABBITMQ_PASS: "rmpassword"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - mynetwork

  postgres:
    image: postgres:16
    container_name: postgre_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mynetwork
  

  mongo:
    image: mongo
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - 27017:27017
    restart: always
    networks:
      - mynetwork

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rmuser
      RABBITMQ_DEFAULT_PASS: rmpassword
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
